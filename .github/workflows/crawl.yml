name: Social Media Crawler Scheduled Run

on:
  schedule:
    # Tự động chạy mỗi 3 ngày vào lúc 00:00 UTC
    - cron: '0 0 */3 * *'
  # Cho phép bấm nút kích hoạt thủ công trực tiếp trên giao diện GitHub
  workflow_dispatch:
    inputs:
      campaign_id:
        description: 'Campaign ID'
        required: false
        default: 'SPIDER-MAN-2026'
      platform:
        description: 'Platform (facebook / tiktok / threads)'
        required: false
        default: 'facebook'
      search_term:
        description: 'Keyword hoặc Hashtag'
        required: false
        default: '#SpiderMan'

jobs:
  run-crawler:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Mã nguồn từ GitHub
        uses: actions/checkout@v4

      - name: 2. Cài đặt môi trường Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Cài đặt các thư viện Npm
        run: npm ci

      - name: 4. Cài đặt trình duyệt Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: 5. Thực thi Tiến trình Crawler
        env:
          CAMPAIGN_ID: ${{ github.event.inputs.campaign_id || 'SPIDER-MAN-2026' }}
          PLATFORM: ${{ github.event.inputs.platform || 'facebook' }}
          SEARCH_TERM: ${{ github.event.inputs.search_term || '#SpiderMan' }}
          APPS_SCRIPT_WEBAPP_URL: ${{ secrets.APPS_SCRIPT_WEBAPP_URL }}
        run: npx ts-node scripts/run-crawler.ts
