name: Social Media Crawler Scheduled Run

on:
  schedule:
    # Tự động chạy mỗi 3 ngày vào lúc 00:00 UTC
    - cron: '0 0 */3 * *'
  # Nút bấm kích hoạt thủ công trên giao diện GitHub Actions
  workflow_dispatch:
    inputs:
      campaign_id:
        description: 'Campaign ID'
        required: false
        default: 'SPIDER-MAN-2026'
      platform:
        description: 'Platform (facebook / tiktok / threads)'
        required: false
        default: 'facebook'
      search_term:
        description: 'Keyword hoặc Hashtag'
        required: false
        default: '#SpiderMan'

jobs:
  run-crawler:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Cài đặt Npm dependencies
        run: npm install --no-package-lock

      - name: 3. Thực thi Crawler Script
        env:
          CAMPAIGN_ID: ${{ github.event.inputs.campaign_id || 'SPIDER-MAN-2026' }}
          PLATFORM: ${{ github.event.inputs.platform || 'facebook' }}
          SEARCH_TERM: ${{ github.event.inputs.search_term || '#SpiderMan' }}
          APPS_SCRIPT_WEBAPP_URL: ${{ secrets.APPS_SCRIPT_WEBAPP_URL }}
        run: npx tsx scripts/run-crawler.ts
