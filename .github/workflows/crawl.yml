name: Social Media Crawler Scheduled Run

on:
  schedule:
    # Runs every 3 days at 00:00 UTC
    - cron: '0 0 */3 * *'
  workflow_dispatch:
    inputs:
      campaign_id:
        description: 'Campaign ID'
        required: false
        default: 'SPIDER-MAN-2026'
      platform:
        description: 'Platform (facebook / tiktok / threads)'
        required: false
        default: 'facebook'
      search_term:
        description: 'Keyword or Hashtag'
        required: false
        default: '#SpiderMan'

jobs:
  run-crawler:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 3. Install Npm dependencies
        run: npm ci

      - name: 4. Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: 5. Build TypeScript code
        run: npm run build

      - name: 6. Execute Crawler Script
        env:
          CAMPAIGN_ID: ${{ github.event.inputs.campaign_id || 'SPIDER-MAN-2026' }}
          PLATFORM: ${{ github.event.inputs.platform || 'facebook' }}
          SEARCH_TERM: ${{ github.event.inputs.search_term || '#SpiderMan' }}
          APPS_SCRIPT_WEBAPP_URL: ${{ secrets.APPS_SCRIPT_WEBAPP_URL }}
        run: node dist/scripts/run-crawler.js
