name: Social Media Crawler Scheduled Run

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:
    inputs:
      campaign_id:
        description: 'Campaign ID'
        required: false
      platform:
        description: 'Platform'
        required: false
      search_term:
        description: 'Keyword hoặc Hashtag'
        required: false
      start_date:
        description: 'Ngày bắt đầu ưu tiên cào'
        required: false

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Cài đặt Npm dependencies
        run: npm install --no-package-lock

      - name: 3. Cài đặt trình duyệt ảo (Chromium)
        run: npx playwright install --with-deps chromium

      - name: 4. Thực thi Crawler Script
        env:
          CAMPAIGN_ID: ${{ github.event.inputs.campaign_id || 'MANUAL' }}
          PLATFORM: ${{ github.event.inputs.platform || 'tiktok' }}
          SEARCH_TERM: ${{ github.event.inputs.search_term || '#Test' }}
          START_DATE: ${{ github.event.inputs.start_date || '' }}
          APPS_SCRIPT_WEBAPP_URL: ${{ secrets.APPS_SCRIPT_WEBAPP_URL }}
        run: npx tsx scripts/run-crawler.ts
